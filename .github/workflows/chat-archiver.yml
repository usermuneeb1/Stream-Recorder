name: Chat archiver

# Preserves live-chat replays BEFORE streams go private. Streams flip to
# private hours after airing, once that happens the chat is unrecoverable.
# Runs the moment a recording finishes (workflow_run) and every 6h as a
# safety net for anything the immediate pass missed.

on:
  workflow_run:
    workflows: ["Stream Recorder"]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-archiver
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq nodejs > /dev/null
          sudo python3 -m pip install -q -U yt-dlp > /dev/null 2>&1 || sudo pip3 install -q -U yt-dlp > /dev/null 2>&1
          yt-dlp --version

      - name: Capture missing chats (newest first, privates race the clock)
        run: |
          chmod +x scripts/archive-chat.sh
          mkdir -p data/chat
          # newest recordings first: they are the most likely still-public
          jq -r 'sort_by(.date) | reverse | .[] | "\(.video_id) \(.video_url)"' \
            data/recordings.json 2>/dev/null | while read -r vid url; do
              [[ -z "$vid" && -z "$url" ]] && continue
              if [[ -s "data/chat/$vid.json" ]]; then
                echo "already archived: $vid"
                continue
              fi
              echo "→ trying: $vid"
              ./scripts/archive-chat.sh "$url" || true
          done

      - name: Commit newly archived chats
        run: |
          git config user.name  "chat-archiver[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/chat/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new chats to commit"
          else
            git commit -m "Archive live chats ($(git diff --cached --name-only | wc -l) files)"
            git push
          fi
