# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   WORKFLOW WATCHDOG                                                          ║
# ║  Alerts Discord when critical automation workflows fail.                     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Workflow watchdog"

on:
  schedule:
    # Hourly
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "How many hours back to inspect"
        required: false
        default: "6"
        type: string

permissions:
  contents: read
  actions: read   # lets the github.token fallback list runs when GH_PAT is absent

defaults:
  run:
    shell: bash

concurrency:
  group: workflow-watchdog
  cancel-in-progress: true

env:
  GH_PAT: ${{ secrets.GH_PAT }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}
  TZ: Asia/Karachi

jobs:
  watchdog:
    name: "Check recent failures"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

      # 2026-10-14: the inspection moved to scripts/workflow-watchdog.sh (tested by
      # tests/workflow-watchdog-test.sh). The previous inline jq piped the
      # critical-names array into index() and then read `.path` off THAT array →
      # "Cannot index array with string path", exit 5, on every hourly run since
      # 2026-08-26. The watchdog never reached Discord once in 7 weeks.
      - name: "Inspect workflows"
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '6' }}
          GITHUB_TOKEN: ${{ github.token }}   # real fallback when GH_PAT is unset
        run: |
          set -euo pipefail
          LOOKBACK="${LOOKBACK_HOURS:-6}"
          FAILURES=$(bash scripts/workflow-watchdog.sh)

          COUNT=$(printf '%s\n' "$FAILURES" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "Found $COUNT recent critical failure(s)"
          {
            echo "##  Workflow Watchdog"
            echo ""
            echo "Lookback: ${LOOKBACK}h"
            echo "Failures: ${COUNT}"
            [[ "$COUNT" != "0" ]] && printf '\n%s\n' "$FAILURES"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$COUNT" == "0" ]]; then
            exit 0
          fi

          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          [[ -z "$WEBHOOK" ]] && exit 0
          # Discord caps an embed description at 4096 chars; a 400 here would
          # turn the alert itself into a failure. Keep the first ~3500 chars.
          if (( ${#FAILURES} > 3500 )); then
            FAILURES="${FAILURES:0:3500}"$'\n'"… (truncated — ${COUNT} total, see the Actions tab)"
          fi
          PAYLOAD=$(jq -n \
            --arg username "☪️ The Muslim Lantern" \
            --arg avatar "${AVATAR_URL:-}" \
            --arg failures "$FAILURES" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg lookback "$LOOKBACK" \
            --arg ts "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{
              content: "@everyone",
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                title: "Critical Workflow Failure Detected",
                description: ("Recent automation failures in `" + $repo + "` within the last **" + $lookback + "h**:\n\n" + $failures),
                color: 15158332,
                timestamp: $ts
              }]
            }')
          curl -fsS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK" >/dev/null
