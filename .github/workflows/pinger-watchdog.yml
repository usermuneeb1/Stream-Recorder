# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   PINGER WATCHDOG                                                           ║
# ║  Watches ONE thing: the stream-recorder's dispatch heartbeat from the       ║
# ║  external pinger (cron-job.org). Alerts Discord ONLY when coverage is       ║
# ║  genuinely degrading — i.e. dispatches used to arrive and stopped.          ║
# ║                                                                              ║
# ║  The go-live sniper is intentionally NOT watched here: its own */2          ║
# ║  schedule fallback provides independent capture coverage, so its            ║
# ║  dispatch count is not an outage signal.                                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Pinger watchdog"

on:
  schedule:
    # Every 30 minutes (two slots per hour, offset to clear the pinger cadence)
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      quiet_minutes:
        description: "Alert if no dispatch-triggered run in this many minutes"
        required: false
        default: "20"
        type: string

permissions:
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: pinger-watchdog
  cancel-in-progress: true

env:
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}

jobs:
  watchdog:
    name: "Check recorder heartbeat"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Check stream-recorder dispatch heartbeat"
        id: check
        env:
          QUIET_MINUTES: ${{ inputs.quiet_minutes || '20' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-recorder.yml/runs"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          DISP=$(curl -fsS "${auth[@]}" "${BASE}?event=repository_dispatch&per_page=1" \
            | jq -r '.workflow_runs[0].created_at // empty' 2>/dev/null || true)

          if [[ -z "$DISP" ]]; then
            # Never dispatched at all — check whether ANY run happened recently.
            ANY=$(curl -fsS "${auth[@]}" "${BASE}?per_page=1" \
              | jq -r '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            if [[ -z "$ANY" ]]; then
              AGE="NEVER"
            else
              AGE_MIN=$(( ($(date +%s) - $(date -d "$ANY" +%s 2>/dev/null || echo 0)) / 60 ))
              if (( AGE_MIN > 90 )); then AGE="STALE(${AGE_MIN}m)"; else AGE="schedule-ok"; fi
            fi
          else
            AGE=$(( ($(date +%s) - $(date -d "$DISP" +%s 2>/dev/null || echo 0)) / 60 ))
          fi
          echo "age=${AGE}" >> "$GITHUB_OUTPUT"

          ALERT="no"
          REASON=""
          case "$AGE" in
            NEVER|STALE*)
              ALERT="yes"
              REASON="stream-recorder has never been triggered by repository_dispatch (${AGE}) — the scheduled fallback may be throttled too."
              ;;
            schedule-ok)
              ;;
            *)
              if (( AGE > QUIET_MINUTES )); then
                ALERT="yes"
                REASON="stream-recorder dispatch heartbeat LOST — last ping ${AGE} min ago (quiet window: ${QUIET_MINUTES})."
              fi
              ;;
          esac
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"
          printf '%s' "$REASON" > /tmp/watchdog-reason.txt
          if [[ -n "$REASON" ]]; then echo "reason: $REASON" >> "$GITHUB_STEP_SUMMARY"; else echo "heartbeat ok (last dispatch ${AGE} min ago)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: "🚨 Alert — recorder coverage degrading"
        if: steps.check.outputs.alert == 'yes'
        run: |
          MSG="🚨 **Pinger watchdog**:"$'\n'"$(cat /tmp/watchdog-reason.txt)"$'\n'"If a stream goes live now it could be missed. Check cron-job.org / the pinger config."
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          if [[ -n "$WEBHOOK" ]]; then
            curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" \
                '{content: $m, username: "Pinger Watchdog", avatar_url: $a}')" >/dev/null 2>&1 || echo "discord send failed"
          fi

      - name: "✅ Heartbeat OK"
        if: steps.check.outputs.alert == 'no'
        run: echo "Recorder dispatch heartbeat healthy — status: ${{ steps.check.outputs.age }}."
