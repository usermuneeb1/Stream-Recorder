# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   PINGER WATCHDOG                                                           ║
# ║  Alerts Discord if the external pinger goes silent. The recorder's real     ║
# ║  coverage comes from cron-job.org firing repository_dispatch every few      ║
# ║  minutes; if that pinger dies, the recorder goes deaf silently and a live   ║
# ║  stream is missed. This workflow checks that dispatch-triggered runs are    ║
# ║  still arriving, and alerts before a stream can be lost.                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Pinger watchdog"

on:
  schedule:
    # Every 30 minutes (two slots per hour, offset to clear the pinger cadence)
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      quiet_minutes:
        description: "Alert if no dispatch-triggered run in this many minutes"
        required: false
        default: "20"
        type: string

permissions:
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: pinger-watchdog
  cancel-in-progress: true

env:
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}

jobs:
  watchdog:
    name: "Check pinger heartbeat"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Find the latest dispatch-triggered run"
        id: check
        env:
          QUIET_MINUTES: ${{ inputs.quiet_minutes || '20' }}
        run: |
          # The last run of EACH watcher workflow that was triggered by a
          # repository_dispatch event (i.e. by the external pinger). The sniper
          # is watched separately because it is the path that is known to be
          # under-covered (0 dispatch runs historically).
          check_workflow() {
            local wf="$1"
            local latest
            latest=$(curl -fsS \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?event=repository_dispatch&per_page=1" \
              | jq -r '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            if [[ -z "$latest" ]]; then
              echo "${wf}:no-run"
              return
            fi
            local now_epoch latest_epoch age_min
            now_epoch=$(date +%s)
            latest_epoch=$(date -d "$latest" +%s 2>/dev/null || echo 0)
            age_min=$(( (now_epoch - latest_epoch) / 60 ))
            echo "${wf}:${age_min}"
          }

          ALERT=""
          for wf in stream-recorder.yml stream-sniper.yml; do
            RESULT=$(check_workflow "$wf")
            AGE="${RESULT#*:}"
            echo "latest_${wf%.yml}=${AGE}" >> "$GITHUB_OUTPUT"
            if [[ "$AGE" == "no-run" ]]; then
              ALERT="${ALERT}${wf} has NEVER been triggered by repository_dispatch.\n"
            elif (( AGE > QUIET_MINUTES )); then
              ALERT="${ALERT}${wf} has no dispatch run in ${AGE} min.\n"
            fi
          done
          echo "alert=$([ -z "$ALERT" ] && echo ok || echo silent)" >> "$GITHUB_OUTPUT"
          printf '%s' "$ALERT" > /tmp/watchdog-alert.txt

      - name: "Alert if the pinger is silent"
        if: steps.check.outputs.alert != 'ok'
        run: |
          ALERT="$(cat /tmp/watchdog-alert.txt)"
          MSG="🚨 **Pinger watchdog**:\n$ALERT"
          MSG="${MSG}If a stream goes live now, it could be missed. Check cron-job.org / the pinger config."
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          if [[ -n "$WEBHOOK" ]]; then
            curl -fsS -X POST "$WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" \
                '{content: $m, username: "Pinger Watchdog", avatar_url: $a}')" >/dev/null 2>&1 || echo "discord send failed"
          else
            echo "no discord webhook configured, alert would be: $MSG"
          fi

      - name: "Recovered"
        if: steps.check.outputs.alert == 'ok'
        run: |
          echo "Pinger heartbeat OK — recorder last dispatch run ${{ steps.check.outputs.latest_stream-recorder }}m ago, sniper ${{ steps.check.outputs.latest_stream-sniper }}m ago"
