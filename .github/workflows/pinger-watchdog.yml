# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   PINGER WATCHDOG                                                           ║
# ║  Two severities, so Discord gets fires — not noise:                         ║
# ║                                                                              ║
# ║  🔴 CRITICAL — dispatch heartbeat LOST (dispatches used to arrive, now      ║
# ║     stale) or a watched workflow has no runs of any kind. Re-alerts every   ║
# ║     cycle until fixed, because coverage is genuinely degrading.             ║
# ║                                                                              ║
# ║  🟡 SETUP NOTE — a workflow that has NEVER seen its dispatch type but IS    ║
# ║     alive through its schedule fallback (e.g. the sniper's */2 cron).       ║
# ║     Coverage exists but is latency-degraded; sent at most once per          ║
# ║     NOTE_COOLDOWN_DAYS via a stamped state file, then goes quiet.           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Pinger watchdog"

on:
  schedule:
    # Every 30 minutes (two slots per hour, offset to clear the pinger cadence)
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      quiet_minutes:
        description: "Alert if no dispatch-triggered run in this many minutes"
        required: false
        default: "20"
        type: string

permissions:
  actions: read
  contents: write        # commit the setup-note throttle stamp

defaults:
  run:
    shell: bash

concurrency:
  group: pinger-watchdog
  cancel-in-progress: true

env:
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}
  # A scheduled run older than this means GitHub throttling disabled the
  # fallback too — that escalates a setup note to a critical alarm.
  ALIVE_WINDOW_MIN: "90"
  # Setup notes repeat at most this often (seconds). 7 days.
  NOTE_COOLDOWN_SEC: "604800"

jobs:
  watchdog:
    name: "Check pinger heartbeat"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Classify each watcher workflow"
        id: check
        env:
          QUIET_MINUTES: ${{ inputs.quiet_minutes || '20' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          latest_age() {  # $1=event filter ('' = any)  $2=workflow file
            local url="${BASE}/$2/runs?per_page=1${1:+&event=$1}"
            local ts
            ts=$(curl -fsS "${auth[@]}" "$url" | jq -r '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            [[ -z "$ts" ]] && { echo "NEVER"; return; }
            echo $(( ($(date +%s) - $(date -d "$ts" +%s 2>/dev/null || echo 0)) / 60 ))
          }

          CRITICAL=""
          NOTES=""
          for wf in stream-recorder.yml stream-sniper.yml; do
            DISP=$(latest_age repository_dispatch "$wf")
            ANY=$(latest_age "" "$wf")
            echo "${wf}: dispatch=${DISP}m any=${ANY}m" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$DISP" != "NEVER" ]] && (( DISP > QUIET_MINUTES )); then
              CRITICAL+="🔴 \`${wf}\` dispatch heartbeat LOST — last ping ${DISP} min ago (quiet window: ${QUIET_MINUTES})."$'\n'
            elif [[ "$DISP" == "NEVER" ]]; then
              if [[ "$ANY" == "NEVER" ]] || (( ANY > ALIVE_WINDOW_MIN )); then
                CRITICAL+="🔴 \`${wf}\` has NEVER been dispatched AND has no recent runs (${ANY}m) — the workflow itself looks dead."$'\n'
              else
                NOTES+="🟡 \`${wf}\` has never been triggered by repository_dispatch — covered right now by its schedule fallback (last run ${ANY} min ago), but latency is degraded vs the ~2-min pinger cadence."$'\n'
              fi
            fi
            echo "latest_${wf%.yml}_dispatch=${DISP}" >> "$GITHUB_OUTPUT"
          done

          echo "critical=$([ -z "$CRITICAL" ] && echo ok || echo yes)" >> "$GITHUB_OUTPUT"
          printf '%s' "$CRITICAL" > /tmp/watchdog-critical.txt
          printf '%s' "$NOTES"    > /tmp/watchdog-notes.txt
          [[ -n "$NOTES" ]] && echo "has_note=yes" >> "$GITHUB_OUTPUT" || echo "has_note=no" >> "$GITHUB_OUTPUT"

      - name: "🔴 Send critical alarm (heartbeat lost / dead workflow)"
        if: steps.check.outputs.critical == 'yes'
        run: |
          MSG="🚨 **Pinger watchdog — CRITICAL**"$'\n'"$(cat /tmp/watchdog-critical.txt)"$'\n'"A live stream could be missed RIGHT NOW. Check cron-job.org and the workflow state."
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          if [[ -n "$WEBHOOK" ]]; then
            curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" \
                '{content: $m, username: "Pinger Watchdog", avatar_url: $a}')" >/dev/null 2>&1 || echo "discord send failed"
          fi

      - name: "🟡 Send setup note (throttled to once per cooldown)"
        if: steps.check.outputs.has_note == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE_FILE="pinger_sniper_note_sent.txt"
          now=$(date +%s)
          last=0
          [[ -f "$NOTE_FILE" ]] && last=$(cat "$NOTE_FILE" 2>/dev/null || echo 0)
          if (( now - last < NOTE_COOLDOWN_SEC )); then
            echo "setup note already sent $(( (now - last) / 86400 ))d ago — staying quiet"
            exit 0
          fi

          MSG="🟠 **Pinger watchdog — setup needed (not an outage)**"$'\n'"$(cat /tmp/watchdog-notes.txt)"$'\n\n'"**Fix — add the second pinger job (2 min):** duplicate your working \`ping-recorder\` job on cron-job.org and change the request body to:"$'\n'"\`\`\`json"$'\n'"{ \"event_type\": \"ping-sniper\" }"$'\n'"\`\`\`"$'\n'"Same URL (\`POST https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches\`), same PAT header. Until then the sniper still catches streams via its own \`*/2\` schedule — just a few minutes slower."
          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          SENT=0
          if [[ -n "$WEBHOOK" ]]; then
            curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" \
                '{content: $m, username: "Pinger Watchdog", avatar_url: $a}')" >/dev/null 2>&1 && SENT=1 || echo "discord send failed"
          fi
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

          if (( SENT )); then
            echo "$now" > "$NOTE_FILE"
            git config user.name  "pinger-watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "$NOTE_FILE"
            git commit -m "pinger watchdog: setup note sent (7-day throttle stamp)" || exit 0
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" >/dev/null 2>&1 || true
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF_NAME:-main}" >/dev/null 2>&1 \
              && echo "throttle stamp committed" \
              || { echo "stamp push failed — note may repeat next cycle"; }
          fi

      - name: "Recovered"
        if: steps.check.outputs.critical == 'ok' && steps.check.outputs.has_note == 'no'
        env:
          RECORDER: ${{ steps.check.outputs['latest_stream-recorder_dispatch'] }}
          SNIPER: ${{ steps.check.outputs['latest_stream-sniper_dispatch'] }}
        run: |
          {
            echo "✅ Pinger heartbeat OK"
            echo "| Workflow | Last dispatch |"
            echo "|---|---|"
            echo "| stream-recorder | ${RECORDER} min ago |"
            echo "| stream-sniper | ${SNIPER} min ago |"
          } >> "$GITHUB_STEP_SUMMARY"
