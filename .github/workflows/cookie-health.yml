# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   COOKIE HEALTH SENTINEL                                                     ║
# ║  Runs independently so YouTube cookie problems alert before a live stream.   ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Cookie health sentinel"

# ─────────────────────────────────────────────────────────────────────────────
# Re-enabled 2026-10-14 (owner request): the recorder runs HYBRID — cookieless
# methods first, cookie methods A/B as the rescue for LOGIN_REQUIRED streams
# (real miss on 2026-06-27). A dead cookie silently removes that rescue, so
# this sentinel checks the critical YouTube session cookie once a day and
# posts ONE Discord alert per day per state (expiring ≤5 days / expired),
# weekly when the file is merely old. Nothing is posted while the cookie is
# healthy. scripts/check-cookies.sh also runs inside every recording job, so
# the same throttled alert fires from there on stream days.
#
# To silence completely: set repo variable PUBLIC_STREAM_ONLY=true (pure
# cookieless mode — then cookies are irrelevant and never alerted on).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 9 * * *"      # daily 09:00 UTC = 14:00 PKT
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cookie-health
  cancel-in-progress: true

env:
  YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
  GH_PAT: ${{ secrets.GH_PAT }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}
  COOKIES_FILE: cookies.txt
  PUBLIC_STREAM_ONLY: ${{ vars.PUBLIC_STREAM_ONLY || 'false' }}
  TZ: Asia/Karachi

jobs:
  cookie-health:
    name: "Verify YouTube cookies"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq coreutils
          sed -i 's/\r$//' scripts/*.sh scripts/*.env 2>/dev/null || true
          chmod +x scripts/*.sh

      - name: "Prepare cookies"
        run: |
          if [[ -z "${YOUTUBE_COOKIES:-}" ]]; then
            echo "⚠️ YOUTUBE_COOKIES secret is empty"
            : > cookies.txt
            exit 0
          fi

          if printf '%s' "$YOUTUBE_COOKIES" | base64 -d > cookies_b64.tmp 2>/dev/null && \
             [[ -s cookies_b64.tmp ]] && \
             head -1 cookies_b64.tmp | grep -qi "netscape\|mozilla\|#\|\.youtube"; then
            mv cookies_b64.tmp cookies.txt
          else
            rm -f cookies_b64.tmp
            printf '%s\n' "$YOUTUBE_COOKIES" > cookies.txt
          fi
          chmod 600 cookies.txt
          echo "Prepared cookies: $(wc -l < cookies.txt) lines"

      - name: "Run cookie health check"
        id: check
        run: bash scripts/check-cookies.sh

      - name: "Summary"
        if: always()
        run: |
          source scripts/utils.sh
          echo "##  Cookie Health Sentinel" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Time | $(now_pkt) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${COOKIE_STATUS:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lines | $(wc -l < cookies.txt 2>/dev/null || echo 0) |" >> "$GITHUB_STEP_SUMMARY"
