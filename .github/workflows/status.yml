# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   System Status, regenerate status JSON + README badges                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "System status"

on:
  push:
    branches: [main]
    paths:
      - "data/recordings.json"
      - "data/youtube-stats.json"
      - "stats.json"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Generate status + badges + public feeds"
        run: |
          python3 scripts/gen-status.py
          # The canonical index is updated through the Contents API by many
          # workflows. Regenerate its derived public artifacts here so those
          # data-only commits cannot leave RSS/podcast/JSON/sitemap stale.
          python3 scripts/generate-feeds.py

      - name: "Purge jsdelivr CDN cache (keep gallery data fresh)"
        run: |
          # stats.json (repo root, written by update-stats.sh) must be purged
          # too — otherwise the CDN keeps serving stale lifetime totals.
          for p in data/recordings.json data/youtube-stats.json data/system-status.json stats.json; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/usermuneeb1/Stream-Recorder@main/$p" || true
          done
          echo "Requested jsDelivr purge for data files."

      - name: "Commit"
        run: |
          # RACE-SAFE commit+push. Previously this was a bare `git push`, which
          # failed intermittently with "! [rejected] main -> main (fetch first)"
          # whenever another workflow (recorder, dependabot, another status
          # trigger) landed a commit on main between our checkout and our push
          # (incident 2026-07-12 run 29176112058). Now: only commit if changed,
          # then rebase onto freshest main and retry so the status lands.
          if [[ -z "$(git status -s data/system-status.json data/badges dashboard/public/feed.xml dashboard/public/podcast.xml dashboard/public/feed.json dashboard/public/sitemap.xml)" ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name "Stream Recorder Bot"
          git config user.email "bot@stream-recorder.local"
          git add data/system-status.json data/badges dashboard/public/feed.xml dashboard/public/podcast.xml dashboard/public/feed.json dashboard/public/sitemap.xml
          git commit -m "Update system status, badges, and public feeds"
          bash scripts/safe-push.sh
