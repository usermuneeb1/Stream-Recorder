# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   REPAIR MIRRORS FROM ARCHIVE.ORG                                            ║
# ║  Reuploads missing/expired Gofile/Pixeldrain/MEGA mirrors from permanent     ║
# ║  Archive.org copies and updates data/recordings.json.                        ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Repair cloud mirrors"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Optional single video_id to repair"
        required: false
        default: ""
        type: string
      max_items:
        description: "Maximum recordings to repair this run (18 = whole archive in one pass)"
        required: false
        default: "6"
        type: string
      destinations:
        description: "Comma list: gofile,pixeldrain,mega,st0807,vikingfile"
        required: false
        default: "gofile,pixeldrain,mega,st0807,vikingfile"
        type: string
      force_repair:
        description: "Force re-upload ALL mirrors of `video_id` (ignore alive checks). Requires video_id."
        required: false
        # 2026-10-24: was "true". mirror-health.yml dispatches this workflow with
        # {"ref":"main"} and no inputs, so GitHub injected this default and every
        # automated repair ran forced: all five mirrors of the first six
        # (newest-first) recordings were re-uploaded 4x/day and the other 14
        # recordings were never reached. Forced repair is now opt-in and
        # script-scoped to a targeted video_id.
        default: "false"
        type: boolean
      dry_run:
        description: "Check only; do not download/upload/update"
        required: false
        default: "false"
        type: boolean

  schedule:
    # Daily repair pass at 08:30 UTC to replace expired temporary mirrors quickly.
    - cron: "30 8 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: repair-mirrors
  cancel-in-progress: false

env:
  GH_PAT: ${{ secrets.GH_PAT }}
  GOFILE_API_KEY: ${{ secrets.GOFILE_API_KEY }}
  PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
  # Optional 0807.st partner token: skips the proof-of-work and lifts the
  # anonymous size cap. Empty = anonymous PoW upload (unchanged behaviour).
  ST0807_TOKEN: ${{ secrets.ST0807_TOKEN }}
  MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
  MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}
  FORCE_REPAIR: ${{ github.event.inputs.force_repair || 'false' }}
  TZ: Asia/Karachi

jobs:
  repair:
    name: "Repair mirrors"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq aria2 megatools bc python3
          sed -i 's/\r$//' scripts/*.sh scripts/*.env 2>/dev/null || true
          chmod +x scripts/*.sh

      - name: "Backfill archive playback nodes"
        # R3AL self-healing: any recording missing archive_direct/archive_node
        # gets them re-derived + re-resolved before repairs run.
        run: bash scripts/backfill-archive-nodes.sh || true

      - name: "Repair from Archive.org"
        env:
          TARGET_VIDEO_ID: ${{ github.event.inputs.video_id }}
          # 6/day (was 3): 16 recordings are missing their 0807.st mirror
          # (2026-10-14); each repair = one Archive.org download + uploads.
          MAX_ITEMS: ${{ github.event.inputs.max_items || '6' }}
          DESTINATIONS: ${{ github.event.inputs.destinations || 'gofile,pixeldrain,mega,st0807,vikingfile' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash scripts/repair-mirrors.sh

      - name: "Summary"
        if: always()
        run: |
          echo "##  Mirror Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Completed at $(TZ='Asia/Karachi' date '+%Y-%m-%d %H:%M PKT')" >> "$GITHUB_STEP_SUMMARY"
