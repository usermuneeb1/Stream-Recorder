# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   MIRROR HEALTH — verify every mirror link is alive, repair when not         ║
# ║  Runs scripts/mirror-health.sh on a schedule. If any recording is below the  ║
# ║  copy guarantee (or any link is dead), it alerts Discord and triggers the    ║
# ║  existing repair-mirrors workflow to re-upload from the permanent copy.      ║
# ║  The dashboard only ever sees healthy mirrors: dead links are healed before  ║
# ║  the archive index is refreshed.                                             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Mirror health"

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: mirror-health
  cancel-in-progress: false

env:
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}

jobs:
  health:
    name: "Check and repair mirrors"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Run mirror health check"
        id: health
        # The script exits non-zero when degraded; that must NOT kill the job,
        # or the alert/repair/merge steps below would be skipped exactly when
        # they are needed. continue-on-error keeps the job alive; the result
        # step reads the JSON the script wrote before exiting.
        continue-on-error: true
        env:
          # lets the script verify Gofile folders via the folder API (same key
          # the uploader uses); absent, Gofile is reported unverifiable
          GOFILE_API_KEY: ${{ secrets.GOFILE_API_KEY }}
        run: |
          bash scripts/mirror-health.sh
        # script exits non-zero when degraded; we capture that via the summary output

      - name: "Read health result"
        id: result
        run: |
          DEAD=$(jq -r '.summary.dead_links // 0' data/mirror-health.json)
          DEGRADED=$(jq -r '.summary.degraded // 0' data/mirror-health.json)
          TOTAL=$(jq -r '.summary.total // 0' data/mirror-health.json)
          echo "dead=$DEAD" >> "$GITHUB_OUTPUT"
          echo "degraded=$DEGRADED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Health: $TOTAL recordings, $DEGRADED degraded, $DEAD dead links"

      - name: "Alert + trigger repair if degraded"
        if: steps.result.outputs.degraded != '0' || steps.result.outputs.dead != '0'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          DEAD="${{ steps.result.outputs.dead }}"
          DEGRADED="${{ steps.result.outputs.degraded }}"
          # Two different failures share this step: a recording BELOW the copy
          # guarantee, and a recording that still meets it but carries dead
          # mirror links. The summary used to list only `.healthy == false`,
          # so the common case (degraded=0, dead>0) alerted "N dead link(s)"
          # and named nothing — the owner could not tell whether repair was
          # converging or the same links were dying forever.
          echo "###  Mirror health degraded" >> "$GITHUB_STEP_SUMMARY"
          echo "- $DEGRADED recording(s) below the copy guarantee" >> "$GITHUB_STEP_SUMMARY"
          echo "- $DEAD dead mirror link(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Literal backticks: inside a single-quoted jq program `\`` is NOT a
          # valid escape — it was a compile error (exit 3) that killed this step
          # under bash -e on 95/100 runs (2026-09-02 → 2026-10-14), so neither
          # the Discord alert nor the repair dispatch below ever ran.
          # tests/mirror-health-alert-step-test.sh replays this step.
          # `.mirrors // {}`: tolerate rows written before mirrors{} existed.
          DETAIL=$(jq -r '
            .recordings[]
            | select((.healthy == false) or ((.dead // 0) > 0))
            | [.video_id,
               (if .healthy then "guarantee met" else "BELOW GUARANTEE" end),
               ((.mirrors // {}) | to_entries | map(select(.value == "dead") | .key) | join(", "))]
            | "- `\(.[0])`: \(.[1]) — dead: \(.[2])"
          ' data/mirror-health.json)
          echo "$DETAIL" >> "$GITHUB_STEP_SUMMARY"

          # Discord alert — carries the same detail, so the ping is actionable
          # without opening the run log.
          MSG="⚠️ **Mirror health degraded**: $DEGRADED recording(s) below guarantee, $DEAD dead link(s). Triggering repair."
          # Build the multi-line message WITHOUT literal newlines in the script:
          # this body is a YAML block scalar, so a continuation line at column 0
          # ends the scalar and breaks the whole workflow file. $'\n' instead.
          # Also `if`, never `(( )) &&` — the runner shell is bash -eo pipefail
          # and a false arithmetic test would abort the step.
          if [[ -n "$DETAIL" ]]; then
            TOP="$(echo "$DETAIL" | head -8)"
            MSG="${MSG}"$'\n'"${TOP}"
            EXTRA=$(( $(echo "$DETAIL" | wc -l) - 8 ))
            if (( EXTRA > 0 )); then
              MSG="${MSG}"$'\n'"…and ${EXTRA} more (see the run summary)"
            fi
          fi
          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          if [[ -n "$WEBHOOK" ]]; then
            curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" '{content:$m, avatar_url:$a}')" \
              >/dev/null 2>&1 || echo "discord send failed"
          fi

          # Trigger the existing repair workflow to re-upload from Archive.org
          if [[ -n "${GH_PAT:-}" ]]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/repair-mirrors.yml/dispatches" \
              -d '{"ref":"main"}' >/dev/null 2>&1 && echo "repair triggered" || echo "repair trigger failed (GH_PAT missing?)"
          else
            echo "no GH_PAT secret — repair not triggered, alert sent"
          fi

      - name: "Merge mirror health into system-status.json"
        if: always()   # keep system-status fresh even on degraded runs
        run: |
          if [[ -f data/system-status.json ]] && [[ -f data/mirror-health.json ]]; then
            jq -s '
              .[1].summary as $mh |
              .[1].updated_at as $mh_ts |
              .[0] + { mirror_health: {
                healthy: ($mh.degraded == 0),
                total:   ($mh.total // 0),
                degraded: ($mh.degraded // 0),
                dead_links: ($mh.dead_links // 0),
                updated_at: ($mh_ts // "")
              }}
            ' data/system-status.json data/mirror-health.json > /tmp/ss.json && mv /tmp/ss.json data/system-status.json
            echo "merged mirror_health into system-status.json"
          else
            echo "system-status.json or mirror-health.json missing, skipping merge"
          fi

      - name: "Commit health data"
        if: always()
        run: |
          git config user.name "usermuneeb1"
          git config user.email "198427088+usermuneeb1@users.noreply.github.com"
          git add data/mirror-health.json data/system-status.json
          git diff --cached --quiet || {
            git commit -m "mirror health snapshot, $(date -u '+%Y-%m-%d %H:%M UTC')"
            bash scripts/safe-push.sh
            echo "committed mirror health"
          }
