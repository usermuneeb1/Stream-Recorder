# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  DISCORD BOT, Scheduled Status & Manual Commands                             ║
# ║                                                                              ║
# ║ Manual commands only (status/latest/accounts/record/refresh) — the          ║
# ║ 6-hourly status post was switched off on 2026-10-14 at the owner's request. ║
# ║                                                                              ║
# ║ SAFE: Standalone workflow. Does NOT modify existing workflows.               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: Discord bot

on:
  # Schedule removed 2026-10-14 (owner request): the 6-hourly "Stream Recorder
  # system status" embed was pure noise. The bot is manual-only now; the
  # dashboard shows the same numbers live.
  workflow_dispatch:
    inputs:
      command:
        description: "Bot command to run"
        required: true
        type: choice
        options:
          - status
          - latest
          - accounts
          - record
          - refresh

jobs:
  bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          COMMAND="${{ github.event.inputs.command || 'status' }}"
          echo "Running command: ${COMMAND}"
          python3 scripts/discord_bot.py "$COMMAND"
