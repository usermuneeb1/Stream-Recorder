<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Theme boot — runs before first paint so the right room is lit.
       Default: dark (a cinema). Saved choice always wins. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mla_theme_v1');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>

  <!-- Primary Meta Tags -->
  <meta name="description" content="The Lantern Archive — every live broadcast of The Muslim Lantern, preserved forever in 1080p. Free to watch, free to share." />
  <meta name="keywords" content="Muslim Lantern, Islamic lectures, dawah, stream archive, live stream recordings, Islamic debates, Muhammed Ali" />
  <meta name="author" content="Muneeb Ahmad" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://muslim-lantern-archive.vercel.app/" />

  <!-- Theme & Platform -->
  <meta name="theme-color" content="#0b0607" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lantern Archive" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="The Lantern Archive" />
  <meta property="og:url" content="https://muslim-lantern-archive.vercel.app/" />
  <meta property="og:title" content="The Lantern Archive — The Muslim Lantern, preserved forever" />
  <meta property="og:description" content="Every live broadcast of The Muslim Lantern, recorded in 1080p and mirrored across five archives. Free to watch." />
  <meta property="og:image" content="/thumbnail.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Lantern Archive" />
  <meta name="twitter:description" content="Every live broadcast of The Muslim Lantern, preserved forever. Free to watch." />
  <meta name="twitter:image" content="/thumbnail.jpg" />

  <title>The Lantern Archive — The Muslim Lantern, preserved forever</title>

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "The Lantern Archive",
    "alternateName": "The Muslim Lantern Stream Archive",
    "url": "https://muslim-lantern-archive.vercel.app/",
    "description": "Every live broadcast of The Muslim Lantern, preserved forever.",
    "publisher": { "@type": "Organization", "name": "The Muslim Lantern" }
  }
  </script>

  <!-- Favicon / PWA -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Fonts: Bebas Neue (cinematic display), Manrope (UI), Spline Sans Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Critical boot: the lantern lights in the room you chose — no flash of the wrong theme -->
  <style>
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
    .boot-flame { width: 10px; height: 10px; border-radius: 50%; background: #e50914; box-shadow: 0 0 18px 6px rgba(230,9,20,.55), 0 0 60px 24px rgba(230,9,20,.18); animation: boot-breathe 2.2s ease-in-out infinite; }
    .boot-word { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 17px; letter-spacing: .42em; text-transform: uppercase; color: #e50914; padding-left: .42em; }
    .boot-bar { width: 120px; height: 1px; background: rgba(230,9,20,.18); position: relative; overflow: hidden; }
    .boot-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #e50914, transparent); transform: translateX(-100%); animation: boot-sweep 1.4s ease-in-out infinite; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #0b0607; color: #f7f2f0; margin: 0; }
    html[data-theme="light"], html[data-theme="light"] body { background: #ffffff; color: #1a1113; margin: 0; }
    html[data-theme="dark"] .boot { background: radial-gradient(ellipse 60% 40% at 50% 42%, rgba(230,9,20,.08), transparent 70%); }
    html[data-theme="light"] .boot { background: radial-gradient(ellipse 60% 40% at 50% 42%, rgba(229,9,20,.06), transparent 70%); }
    html[data-theme="light"] .boot-word { color: #c40812; }
    @keyframes boot-breathe { 0%,100% { opacity:.6; transform: scale(.92);} 50% { opacity:1; transform: scale(1);} }
    @keyframes boot-sweep { to { transform: translateX(100%); } }
  </style>
</head>
<body class="antialiased">
  <div id="root">
    <div class="boot">
      <div class="boot-flame"></div>
      <span class="boot-word">Lantern</span>
      <div class="boot-bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
