# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   GITLAB CI — SECOND INDEPENDENT PINGER + FALLBACK BRAIN                    ║
# ║  Purpose: if GitHub's own cron (throttled) or the cron-job.org pinger      ║
# ║  dies, GitLab's scheduler keeps firing repository_dispatch so detection    ║
# ║  never goes deaf. Also the home of the GitHub-outage fallback brain.       ║
# ║                                                                             ║
# ║  REQUIRED GitLab CI variables:                                             ║
# ║    GH_PAT  — a GitHub PAT with `repo` scope (used to fire dispatches)      ║
# ║                                                                             ║
# ║  REQUIRED GitLab setup (one-time, ~3 min):                                 ║
# ║    1. Settings → CI/CD → Variables → add GH_PAT (masked)                   ║
# ║    2. Build → Pipeline schedules → New schedule, cron "*/5 * * * *"        ║
# ║       targeting this file's `ping` job (and later `record`).               ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

stages:
  - ping

# ── Pinger: fire both GitHub dispatch events every 5 min ───────────────────────
# This is a SECOND independent scheduler (GitLab's infra, not GitHub's), so a
# cron-job.org outage or GitHub cron throttling cannot stop detection.
ping-github-recorder:
  stage: ping
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - apk add --no-cache curl
    - |
      curl -fsS -X POST \
        -H "Authorization: Bearer ${GH_PAT}" \
        -H "Accept: application/vnd.github+json" \
        -H "Content-Type: application/json" \
        "https://api.github.com/repos/usermuneeb1/Stream-Recorder/dispatches" \
        -d '{"event_type":"ping-recorder"}' || echo "recorder ping failed"
    - |
      curl -fsS -X POST \
        -H "Authorization: Bearer ${GH_PAT}" \
        -H "Accept: application/vnd.github+json" \
        -H "Content-Type: application/json" \
        "https://api.github.com/repos/usermuneeb1/Stream-Recorder/dispatches" \
        -d '{"event_type":"ping-sniper"}' || echo "sniper ping failed"
