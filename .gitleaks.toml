# gitleaks configuration for Stream-Recorder
# Uses the default rule set, with allowlists for files that intentionally
# contain low-risk or already-public data.
[extend]
useDefault = true

[allowlist]
description = "Project-specific allowlist"
paths = [
  # Disposable cloud-account CSVs are intentionally committed for this project
  # (throwaway accounts, not personal credentials).
  '''scripts/mega/accounts\.csv''',
  '''scripts/pixeldrain/accounts\.csv''',
  # Lockfiles can contain hash-like strings that trigger false positives.
  '''dashboard/package-lock\.json''',
  # Historical script (later deleted) that includes Google IAM API enum
  # constants — gitleaks v3 flagged them as a generic-api-key false positive.
  '''scripts/gdrive/.*''',
]
# Ignore obvious placeholder/example values + known false-positive enum strings.
regexes = [
  '''INSERT_YOUR_.*_HERE''',
  '''example\.com''',
  '''YOUR-NAME''',
  # Google IAM API enum constants used in service-account creation calls.
  # These are NOT secrets — they're the literal string names of Google's
  # public API enums (KEY_ALG_RSA_2048 / TYPE_GOOGLE_CREDENTIALS_FILE).
  '''KEY_ALG_RSA_2048''',
  '''TYPE_GOOGLE_CREDENTIALS_FILE''',
]
# NOTE: `commits` does NOT mean "stop scanning here" — gitleaks skips findings
# in exactly these SHAs and nothing else. The previous entry (784c714e, the
# commit AFTER the reviewed history) suppressed nothing, so the weekly
# full-history schedule scan failed 6/6 times (2026-08-03 → 2026-10-12) and
# paged Discord "Potential secret detected!" every Monday, while push scans
# (which only cover the pushed range) stayed green.
#
# 8e495b07 (2026-04-17, "Premium dashboard v3") is the only commit that fires:
# 208 findings in lofi.html / sava.html / streams.html (deleted 2026-06-13) —
# saved YouTube page blobs (entityKey/rolloutToken/... generic-api-key hits)
# plus one `AIza…` gcp-api-key repeated 96×. That key is NOT YouTube's public
# innertube web key; if it was ever a project key, make sure it is restricted
# or rotated — this allowlist silences the weekly alarm, it does not purge it
# from history.
commits = [
  "8e495b07ca232bbc999ce43047064495548fd6c0",
]
